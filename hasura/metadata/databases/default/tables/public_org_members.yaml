table:
  schema: public
  name: org_members
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, user_id, role, created_at, updated_at]
      filter:
        organization:
          org_members:
            user_id: { _eq: X-Hasura-User-Id }
      # any member of the org can see the member/role list (needed for the
      # approval UI to show who can approve, and for org admin screens).
insert_permissions:
  - role: user
    permission:
      # Only an existing owner of the org can add members. New row's org_id
      # must match an org where the caller is owner (checked via the
      # relationship on the *existing* org_members rows for that org — the
      # check runs against the row being inserted's org_id).
      check:
        organization:
          org_members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
      columns: [org_id, user_id, role]
update_permissions:
  - role: user
    permission:
      columns: [role]
      filter:
        organization:
          org_members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            _and:
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
